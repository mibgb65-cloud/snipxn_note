spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?stringtype=unspecified
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${MAIL_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

snipxn:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_FROM:noreply@snipxn.com}

logging:
  level:
    root: warn
    com.snipxn: info
